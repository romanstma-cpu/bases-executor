name: Build Bases Executor

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW/MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-lua51

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build --config Release

      - name: Package
        shell: msys2 {0}
        run: |
          echo '{"datamodel":"48 8B 0D ?? ?? ?? ?? 48 8B 01","scheduler":"48 8D 05 ?? ?? ?? ?? 48 89 05"}' > build/Release/unc_patterns.json
          cd build/Release
          zip bases-executor.zip bases_executor.exe unc_patterns.json || ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: bases-executor-bin
          path: build/Release/bases-executor.zip